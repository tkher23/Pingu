<!DOCTYPE html>
<html>
<head>
  <title>Pingu Email Crafter</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'self'">
  <script src="popup.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 400px;
      padding: 15px;
    }
    textarea, input {
      width: 100%;
      margin-bottom: 10px;
    }
    button {
      margin: 5px 5px 10px 0;
      padding: 5px 10px;
    }
    #output {
      white-space: pre-wrap;
      background-color: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }
    .tab { display: none; }
    .tab.active { display: block; }
    .tab-buttons { margin-bottom: 10px; }
    .tab-buttons button { padding: 5px 10px; margin-right: 5px; }
    #login-section { text-align: center; }
  </style>
</head>
<body>

  <div id="login-section">
    <h3>Please log in with Google</h3>
    <h4 style="color: #4da6ff;">Welcome aboard, Pingu reporting for email duty!</h4>
    <button id="login-btn">Login with Google</button>
  </div>

  <div id="main-ui" style="display: none;">
    <h3>Pingu</h3>
    <p id="credits-display" style="font-weight: bold;">Credits: loading...</p>

    <div class="tab-buttons">
      <button id="tab-simple-btn">Simple Email</button>
      <button id="tab-craft-btn">Advanced Email</button>
      <button id="tab-settings-btn">Settings</button>
      <button id="logout-btn" style="float:right;">Logout</button>
    </div>

    <!-- Advanced Email Tab -->
    <div class="tab active" id="tab-craft">
      <label for="recipient-name">Recipient's Name:</label>
      <input id="recipient-name" type="text" />

      <label for="recipient-email">Recipient's Email:</label>
      <input id="recipient-email" type="email" />

      <label for="linkedin">LinkedIn Text:</label>
      <textarea id="linkedin" rows="4"></textarea>

      <label for="bio">Bio Page Text:</label>
      <textarea id="bio" rows="4"></textarea>

      <label for="values">Company Values Text:</label>
      <textarea id="values" rows="4"></textarea>

      <label for="interest">Internship Interest:</label>
      <input id="interest" type="text" />

      <button id="generate-advanced-email">Generate Advanced Email</button>

      <h4>Subject Line Output:</h4>
      <textarea id="subject-output" rows="2"></textarea>
      <button id="generate-subject">Give me another subject</button>

      <h4>Email Output:</h4>
      <textarea id="output" rows="10"></textarea>
      <button id="craft">Give me another email</button>

      <button id="copy-email-btn">Copy Email</button>
      <button id="copy-subject-btn">Copy Subject</button>
      <div id="copy-confirmation"></div>

      <button id="send-gmail-btn">Send Email via Gmail</button>
      <span id="send-status"></span>
    </div>

    <!-- Simple Email Tab -->
    <div class="tab" id="tab-simple">
      <label for="simple-recipient">Recipient's Name:</label>
      <input id="simple-recipient" type="text" />

      <label for="simple-recipient-email">Recipient's Email:</label>
      <input id="simple-recipient-email" type="email" />

      <label for="simple-interest">Internship Interest:</label>
      <input id="simple-interest" type="text" />

      <button id="generate-simple-email">Generate Simple Email</button>

      <h4>Subject Line Output:</h4>
      <textarea id="simple-subject-output" rows="2"></textarea>

      <h4>Email Output:</h4>
      <textarea id="simple-email-output" rows="10"></textarea>

      <button id="copy-simple-email-btn">Copy Email</button>
      <button id="copy-simple-subject-btn">Copy Subject</button>
      <div id="simple-copy-confirmation"></div>

      <button id="send-simple-gmail-btn">Send Email via Gmail</button>
      <span id="simple-send-status"></span>
    </div>

    <!-- Settings Tab -->
    <div class="tab" id="tab-settings">
      <label for="user-name">Your Name:</label>
      <input id="user-name" type="text" />

      <label for="user-intro">Brief Intro:</label>
      <textarea id="user-intro" rows="3"></textarea>

      <label for="default-interest">Default Career/Internship Interest:</label>
      <input id="default-interest" type="text" />

      <label for="persona-context">Personal Context:</label>
      <textarea id="persona-context" rows="3"></textarea>

      <label for="company-interest">Company of Interest:</label>
      <input id="company-interest" type="text" />

      <label for="role-type">Role Type:</label>
      <select id="role-type">
        <option value="internship">Internship</option>
        <option value="full-time">Full-Time</option>
      </select>

      <button id="save-profile">Save Profile</button>
      <div id="save-msg"></div>
    </div>
  </div>

</body>
</html>
